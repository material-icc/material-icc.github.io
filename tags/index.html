(function () {
  "use strict";

  function corregirEtiquetas() {
    document.querySelectorAll("mirla-index").forEach(function (componente) {
      const raiz = componente.shadowRoot;
      if (!raiz) return;

      raiz.querySelectorAll("label").forEach(function (etiqueta) {
        const texto = etiqueta.textContent.trim();

        if (texto === "Tipo_de_publicación") {
          etiqueta.textContent = "Tipo de publicación";
        }
      });
    });
  }

  function iniciar() {
    corregirEtiquetas();

    document.querySelectorAll("mirla-index").forEach(function (componente) {
      const raiz = componente.shadowRoot;
      if (!raiz || raiz.dataset.materialLabels) return;

      /* Observar cambios en los filtros */
      const observador = new MutationObserver(corregirEtiquetas);

      observador.observe(raiz, {
        childList: true,
        subtree: true
      });

      raiz.dataset.materialLabels = "true";
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", iniciar);
  } else {
    iniciar();
  }

  const observadorPagina = new MutationObserver(iniciar);

  observadorPagina.observe(document.documentElement, {
    childList: true,
    subtree: true
  });

})();</script><script>/* MATERIAL — ETIQUETAS BIBLIOGRÁFICAS */

(function () {
  "use strict";

  const nombres = {
    "label": "Título",
    "Tipo_de_publicación": "Tipo de publicación",
    "Tipo_de_autoría": "Tipo de autoría",
    "Número_o_volumen": "Número o volumen",
    "Editorial_1": "Editorial",
    "Editorial_2": "Segunda editorial",
    "Número_de_páginas": "Número de páginas",
    "Original_firmado": "Original firmado",
  };

  function normalizar(texto) {
    return String(texto || "").trim();
  }

  function corregirFichas() {

    /* Solo actuar sobre páginas de libros */

    if (!/\/item\//i.test(window.location.pathname)) {
      return;
    }

    document.querySelectorAll("table").forEach(function (tabla) {

      tabla.querySelectorAll("tr").forEach(function (fila) {

        const celda = fila.querySelector("th, td");

        if (!celda) return;

        const nombreActual = normalizar(celda.textContent);

        if (Object.prototype.hasOwnProperty.call(
          nombres,
          nombreActual
        )) {
          celda.textContent = nombres[nombreActual];
        }

      });

    });

  }

  if (document.readyState === "loading") {
    document.addEventListener(
      "DOMContentLoaded",
      corregirFichas
    );
  } else {
    corregirFichas();
  }

})();</script></body></html>

   MATERIAL — CATÁLOGO MIRLA
   6 COLUMNAS / CENTRADO / FILTROS
   ========================================== */

(function () {
  "use strict";

  /* CONFIGURACIÓN */

  const ESTILO_ID = "material-mirla-estilos";

  /* ETIQUETAS DE LAS FICHAS BIBLIOGRÁFICAS */

  const nombres = {
    "label": "Título / Title",
    "Tipo_de_publicación": "Tipo de publicación / Publication type",
    "Subtítulo": "Subtítulo / Subtitle",
    "Autoría": "Autoría / Authorship",
    "Tipo_de_autoría": "Tipo de autoría / Authorship type",
    "Número_o_volumen": "Número o volumen / Number or volume",
    "Colección": "Colección / Collection",
    "Editorial_1": "Editorial / Publisher",
    "Editorial_2": "Segunda editorial / Second publisher",
    "Editorial": "Editorial / Publisher",
    "Año": "Año / Year",
    "Ciudad": "Ciudad / City",
    "País": "País / Country",
    "Edición": "Edición / Edition",
    "Encuadernación": "Encuadernación / Binding",
    "Dimensiones": "Dimensiones / Dimensions",
    "Número_de_páginas": "Número de páginas / Number of pages",
    "Idioma": "Idioma / Language",
    "ISBN": "ISBN",
    "Original_firmado": "Original firmado / Signed copy",
    "Consulta": "Consulta / Access",
    "Resumen": "Resumen / Abstract"
  };

  /* ESTILOS INTERNOS DE MIRLA */

  const estilos = `

    /* TIPOGRAFÍA */

    :host,
    .mirla-app-container,
    .preview-gallery,
    .preview-item,
    .item-title,
    .controls-container,
    .pager-container,
    input,
    select,
    button,
    label {
      font-family: "Avenir", Helvetica, Arial,
        sans-serif !important;
    }

    /* CONTENEDOR GENERAL CENTRADO */

    :host {
      display: block !important;
      width: 100% !important;
      box-sizing: border-box !important;
    }

    .mirla-app-container {
      display: block !important;
      width: 100% !important;
      max-width: 1400px !important;
      margin-left: auto !important;
      margin-right: auto !important;
      box-sizing: border-box !important;
    }

    /* BUSCADOR Y FILTROS */

    .controls-container {
      width: 100% !important;
      max-width: 1400px !important;
      margin-left: auto !important;
      margin-right: auto !important;
      box-sizing: border-box !important;
    }

    /* PAGINACIÓN */

    .pager-container {
      width: 100% !important;
      max-width: 1400px !important;
      margin-left: auto !important;
      margin-right: auto !important;
      box-sizing: border-box !important;
    }

    /* CUADRÍCULA DE SEIS COLUMNAS */

    .preview-gallery {
      display: grid !important;

      grid-template-columns:
        repeat(6, minmax(0, 1fr)) !important;

      column-gap: 18px !important;
      row-gap: 32px !important;

      width: 100% !important;
      max-width: 1400px !important;

      margin-left: auto !important;
      margin-right: auto !important;

      box-sizing: border-box !important;
    }

    /* CADA PUBLICACIÓN */

    .preview-item {
      min-width: 0 !important;
      width: 100% !important;
      max-width: none !important;
      background: transparent !important;
      box-sizing: border-box !important;
    }

    /* CUBIERTAS */

    .image-container {
      width: 100% !important;
      aspect-ratio: 3 / 4;
      background: #f3f3f3 !important;
      overflow: hidden !important;
    }

    .image-container img {
      display: block;
      width: 100% !important;
      height: 100% !important;
      object-fit: contain !important;
    }

    /* PUBLICACIONES SIN IMAGEN */

    .no-image-placeholder {
      width: 100% !important;
      height: 100% !important;
      background: #f3f3f3 !important;
      border: 1px solid #e8e8e8 !important;
      box-sizing: border-box !important;
    }

    /* TÍTULOS */

    .item-title {
      font-family: "Avenir", Helvetica, Arial,
        sans-serif !important;

      font-size: 13px !important;
      font-weight: 400 !important;
      line-height: 1.45 !important;

      text-align: left !important;
      color: #333333 !important;
    }

    /* ENLACES */

    .card-link {
      text-decoration: none !important;
      color: #333333 !important;
    }

    /* TABLET */

    @media (max-width: 1000px) {

      .preview-gallery {
        grid-template-columns:
          repeat(3, minmax(0, 1fr)) !important;

        column-gap: 18px !important;
        row-gap: 28px !important;
      }

    }

    /* MÓVIL */

    @media (max-width: 650px) {

      .preview-gallery {
        grid-template-columns:
          repeat(2, minmax(0, 1fr)) !important;

        column-gap: 14px !important;
        row-gap: 24px !important;
      }

      .item-title {
        font-size: 12px !important;
      }

    }

  `;

  /* ELIMINAR IDIOMA DE LOS FILTROS */

  function ajustarFiltros(componente) {

    const filtros = componente.getAttribute("filters");

    if (!filtros) return;

    const nuevosFiltros = filtros
      .split(",")
      .map(function (filtro) {
        return filtro.trim();
      })
      .filter(function (filtro) {
        return filtro.toLowerCase() !== "idioma";
      })
      .join(",");

    if (nuevosFiltros !== filtros) {
      componente.setAttribute("filters", nuevosFiltros);
    }
  }

  /* ETIQUETAS VISIBLES DEL BUSCADOR */

  function corregirEtiquetas(raiz) {

    raiz.querySelectorAll("label").forEach(function (etiqueta) {

      const texto = etiqueta.textContent.trim();

      if (texto === "Tipo_de_publicación") {
        etiqueta.textContent = "Tipo de publicación";
      }

    });

  }

  /* APLICAR LOS ESTILOS AL SHADOW DOM */

  function ajustarMirla() {

    document.querySelectorAll("mirla-index")
      .forEach(function (componente) {

        ajustarFiltros(componente);

        const raiz = componente.shadowRoot;

        if (!raiz) return;

        /* EVITAR ESTILOS DUPLICADOS */

        if (!raiz.querySelector("#" + ESTILO_ID)) {

          const estilo = document.createElement("style");

          estilo.id = ESTILO_ID;
          estilo.textContent = estilos;

          raiz.appendChild(estilo);
        }

        corregirEtiquetas(raiz);

        /* OBSERVAR ACTUALIZACIONES DE MIRLA */

        if (!componente.__materialObservador) {

          const observador = new MutationObserver(function () {
            corregirEtiquetas(raiz);
          });

          observador.observe(raiz, {
            childList: true,
            subtree: true
          });

          componente.__materialObservador = observador;
        }

      });

  }

  /* FICHAS BIBLIOGRÁFICAS */

  function corregirFichas() {

    if (!/\/item\//i.test(window.location.pathname)) {
      return;
    }

    document.querySelectorAll("table")
      .forEach(function (tabla) {

        tabla.querySelectorAll("tr")
          .forEach(function (fila) {

            const celda = fila.querySelector("th, td");

            if (!celda) return;

            const nombreActual =
              String(celda.textContent || "").trim();

            if (
              Object.prototype.hasOwnProperty.call(
                nombres,
                nombreActual
              )
            ) {
              celda.textContent = nombres[nombreActual];
            }

          });

      });

  }

  /* INICIAR */

  function iniciar() {

    ajustarMirla();
    corregirFichas();

    const observadorPagina = new MutationObserver(function () {
      ajustarMirla();
    });

    observadorPagina.observe(document.documentElement, {
      childList: true,
      subtree: true
    });

  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", iniciar);
  } else {
    iniciar();
  }

})();</script></body></html>
